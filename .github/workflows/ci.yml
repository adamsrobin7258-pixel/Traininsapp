name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ios:
        description: 'Also build the iOS app (macOS runner)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: dist
          retention-days: 7

  android:
    name: Android debug build
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Verify and name APK
        id: apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APK="kalethra-${VERSION}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          BADGING=$("$BUILD_TOOLS/aapt2" dump badging "$APK" | head -1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='com.kalethra.app'"
          echo "$BADGING" | grep -q "versionName='${VERSION}'"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | grep "Signer #1 certificate"
          echo "file=$APK" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v5
        with:
          name: kalethra-debug-apk
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS simulator build
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    needs: web
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build for simulator (unsigned)
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
