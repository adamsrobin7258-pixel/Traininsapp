name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ios:
        description: 'Also build the iOS app (macOS runner)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: dist
          retention-days: 7

  e2e:
    name: End-to-end (Playwright)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  android:
    name: Android debug build
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Verify and name APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          APK="kalethra-${VERSION}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          # Newest stable build-tools (skip release candidates).
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | grep -v -- '-rc' | sort -V | tail -1)"
          echo "Using $BUILD_TOOLS"

          BADGING=$("$BUILD_TOOLS/aapt2" dump badging "$APK" | sed -n 1p)
          echo "$BADGING"
          grep -q "name='com.kalethra.app'" <<< "$BADGING"
          grep -q "versionName='${VERSION}'" <<< "$BADGING"

          # The APK must be signed with the shared debug key so it installs as an update.
          SIGNER=$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" 2>&1)
          echo "$SIGNER"
          ACTUAL=$(grep -m1 'certificate SHA-256 digest' <<< "$SIGNER" | awk '{print $NF}')
          EXPECTED=$(keytool -list -v -keystore android/app/debug.keystore -storepass android \
            -alias androiddebugkey | grep 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "Signer SHA-256: $ACTUAL"
          echo "Expected:       $EXPECTED"
          test -n "$ACTUAL" && test "$ACTUAL" = "$EXPECTED"

          # Health Connect: exactly the four read permissions Kalethra uses – no write,
          # history or background access, nothing the plugin declares on top (see manifest).
          HEALTH=$("$BUILD_TOOLS/aapt2" dump permissions "$APK" \
            | grep -o "android.permission.health\.[A-Z0-9_]*" | sort -u | tr '\n' ' ')
          echo "Health permissions: $HEALTH"
          test "$HEALTH" = "android.permission.health.READ_ACTIVE_CALORIES_BURNED android.permission.health.READ_EXERCISE android.permission.health.READ_STEPS android.permission.health.READ_WEIGHT "
          echo "file=$APK" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v5
        with:
          name: kalethra-debug-apk
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS simulator build
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    needs: web
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build for simulator (unsigned)
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
